# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#020304'
    fc: '#020304'
  debug_water_hillshade: false
  elevation_profile:
    alpha: 0.9
    color: '#ff5cf0'
    enabled: true
    height: 0.04
    outline:
      alpha: 0.7
      color: '#07141b'
      enabled: true
      linewidth: 0.8
    route:
      alpha: 0.85
      color: '#ff5cf0'
      enabled: true
      end_marker:
        color: '#ff5c93'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#020304'
        ring_color: '#ff5c93'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
      linewidth: 4.0
      outline:
        color: '#07141b'
        enabled: true
        linewidth: 0.9
      sampling:
        interval_m: 300
        max_points: 500
        min_points: 40
        mode: distance_interval
      start_marker:
        color: '#64d977'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#020304'
        ring_color: '#64d977'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
  frame:
    color: '#1a0d2e'
    enabled: true
    padding: 0.04
  hillshade:
    alpha: 0.12
    altitude: 34
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gray
    interpolation: bicubic
    multidirectional: true
    multiscale:
      enabled: true
      scales:
      - sigma: 6.5
        weight: 0.58
      - sigma: 1.4
        weight: 0.42
    render_mode: cmap
    sigma: 0.0
    tint:
      highlight_color: '#52f7ff'
      mid_color: '#08141b'
      shadow_color: '#010203'
    tone:
      ambient: 0.1
      bias: 0.0
      clip_high: 0.97
      clip_low: 0.18
      contrast: 1.55
      gamma: 0.92
    unsharp_amount: 0.2
    unsharp_radius: 0.6
    vert_exag: 1.4
    weights:
    - 1.3
    - 1.0
    - 0.7
    - 0.7
    zorder: 0
  info:
    color: '#67f8ff'
    font: Inter
    position: bottom-right
    show: false
    size: 0.01
    text: map-artistry
  info_panel:
    background:
      alpha: 1.0
      color: '#1a0d2e'
    elements:
    - align: left
      alpha: 1.0
      color: '#e0d4f7'
      content: RIVER VALLEY LOOP
      font: Inter
      font_weight: bold
      id: title
      size: 0.42
      tracking: 0.1
      transform: uppercase
      type: title
      x: 0.03
      y: 0.65
    - align: left
      alpha: 1.0
      color: '#b8a7d9'
      content: GPX-DERIVED REGION
      font: Inter
      font_weight: normal
      id: subtitle
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.03
      y: 0.25
    - align: right
      alpha: 1.0
      color: '#b8a7d9'
      content: ''
      font: Inter
      font_weight: normal
      id: location
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.97
      y: 0.65
    - align: right
      font: Inter
      id: stats
      items:
      - value: 48 KM
        label: DISTANCE
      - value: 326 M
        label: ELEV GAIN
      label_alpha: 1.0
      label_color: '#b8a7d9'
      label_size: 0.1
      label_weight: normal
      layout: horizontal
      spacing: 0.04
      transform: uppercase
      type: stats
      value_alpha: 1.0
      value_color: '#e0d4f7'
      value_size: 0.22
      value_weight: bold
      x: 0.97
      y: 0.3
    enabled: true
    height: 0.12
    padding: 0.015
    position: bottom
    zorder: 1000
  satellite:
    alpha: 1.0
    visible: false
    path: downloads/routes/edmonton-50km/satellite.tif
  scheme: neon_cyber
  terrain:
    alpha: 1.0
    blend_mode: soft_light
    colors:
    - '#010203'
    - '#041017'
    - '#061720'
    - '#0a2430'
    - '#0f3441'
    - '#184a58'
    - '#246f7c'
    - '#35a9b2'
    - '#63ffff'
    interpolation: bicubic
    percentiles:
    - 2
    - 98
    shade_strength: 0.6
    stretch: linear
    stretch_exponent: 1.0
    visible: false
    zorder: 0
  water_hillshade:
    bias: 0.02
    blur_sigma: 7.0
    contrast: 0.25
  route_gpx: downloads/cycling-routes/edmonton-50km.gpx
  dem: downloads/routes/edmonton-50km/dem.tif
