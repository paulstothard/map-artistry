# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#aa332e'
    fc: '#aa332e'
  elevation_profile:
    alpha: 1.0
    color: '#3d3d3d'
    enabled: true
    height: 0.04
    route:
      alpha: 0.85
      color: '#1f1f1f'
      enabled: true
      end_marker:
        color: '#5d1a12'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#ffffff'
        ring_color: '#5d1a12'
        ring_width_scale: 0.14
        size: 8.0
        style: concentric_circles
      linewidth: 5.5
      outline:
        color: '#ffffff'
        enabled: true
        linewidth: 1.5
      sampling:
        interval_m: 300
        max_points: 500
        min_points: 40
        mode: distance_interval
      start_marker:
        color: '#2e7d32'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#ffffff'
        ring_color: '#2e7d32'
        ring_width_scale: 0.14
        size: 8.0
        style: concentric_circles
  frame:
    color: '#f7d0ca'
    enabled: true
    padding: 0.04
  hillshade:
    alpha: 0
    altitude: 45
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gist_heat
    interpolation: bicubic
    multidirectional: true
    sigma: 1.0
    vert_exag: 1.0
    weights:
    - 1.2
    - 1.0
    - 0.8
    - 0.8
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.0
      clip_high: 1.0
      contrast: 1.0
      gamma: 1.0
      bias: 0.0
      ambient: 0.0
    tint:
      shadow_color: '#0b0f14'
      mid_color: '#5f6368'
      highlight_color: '#f3f1eb'
    multiscale:
      enabled: false
      scales:
      - sigma: 8.0
        weight: 0.65
      - sigma: 2.0
        weight: 0.35
  info:
    color: '#000000'
    font: Inter
    position: bottom-right
    show: false
    size: 0.01
    text: map-artistry
  info_panel:
    background:
      alpha: 1.0
      color: '#1f1f1f'
    elements:
    - align: left
      alpha: 1.0
      color: '#f7d0ca'
      content: ''
      font: Inter
      font_weight: bold
      id: title
      size: 0.42
      tracking: 0.1
      transform: uppercase
      type: title
      x: 0.03
      y: 0.65
    - align: left
      alpha: 1.0
      color: '#f3b8ad'
      content: ''
      font: Inter
      font_weight: normal
      id: subtitle
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.03
      y: 0.25
    - align: right
      alpha: 1.0
      color: '#f3b8ad'
      content: ''
      font: Inter
      font_weight: normal
      id: location
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.97
      y: 0.65
    - align: right
      font: Inter
      id: stats
      items: []
      label_alpha: 1.0
      label_color: '#f3b8ad'
      label_size: 0.1
      label_weight: normal
      layout: horizontal
      spacing: 0.04
      transform: uppercase
      type: stats
      value_alpha: 1.0
      value_color: '#f7d0ca'
      value_size: 0.22
      value_weight: bold
      x: 0.97
      y: 0.3
    enabled: false
    height: 0.12
    padding: 0.015
    position: bottom
    zorder: 1000
  satellite:
    opacity: 1.0
    visible: false
    path: downloads/regions/vestland-norway/satellite.tif
  scheme: coral
