# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#f9f9f6'
    fc: '#f9f9f6'
  debug_water_hillshade: false
  hillshade:
    alpha: 1.0
    altitude: 36
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gray
    interpolation: bicubic
    multidirectional: true
    multiscale:
      enabled: true
      scales:
      - sigma: 9.5
        weight: 0.7
      - sigma: 2.5
        weight: 0.3
    render_mode: tinted
    sigma: 0.0
    tint:
      highlight_color: '#ffffff'
      mid_color: '#efefea'
      shadow_color: '#d6d7d2'
    tone:
      ambient: 0.36
      bias: 0.0
      clip_high: 0.88
      clip_low: 0.04
      contrast: 0.95
      gamma: 1.04
    unsharp_amount: 0.3
    unsharp_radius: 1.4
    vert_exag: 1.9
    weights:
    - 1.15
    - 1.0
    - 0.85
    - 0.85
    zorder: 0
  info:
    color: '#9a9a93'
    font: Gill Sans
    fontsize: 8
    position: bottom-right
    show: false
    text: map-artistry
  satellite:
    opacity: 1.0
    visible: false
    path: downloads/regions/oahu-hi/satellite.tif
  scheme: porcelain_ink
  terrain:
    alpha: 1.0
    blend_mode: soft_light
    colors:
    - '#d9dad5'
    - '#e0e1dc'
    - '#e6e7e2'
    - '#ebece7'
    - '#efefea'
    - '#f2f2ee'
    - '#f5f5f1'
    - '#f8f8f5'
    - '#ffffff'
    interpolation: bicubic
    percentiles:
    - 2
    - 98
    shade_strength: 0.6
    stretch: linear
    stretch_exponent: 1.0
    visible: false
    zorder: 0
  water_hillshade:
    bias: 0.01
    blur_sigma: 8.0
    contrast: 0.1
  dem: downloads/regions/oahu-hi/dem.tif
