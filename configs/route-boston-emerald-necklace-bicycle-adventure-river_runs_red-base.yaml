# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#000000'
    fc: '#000000'
  elevation_profile:
    alpha: 0.92
    color: '#ffeb3b'
    enabled: true
    height: 0.04
    outline:
      alpha: 0.7
      color: '#000000'
      enabled: true
      linewidth: 0.8
    route:
      alpha: 0.95
      color: '#ffeb3b'
      enabled: true
      end_marker:
        color: '#ffe082'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#120001'
        ring_color: '#ffe082'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
      linewidth: 4.5
      outline:
        color: '#000000'
        enabled: true
        linewidth: 1.2
      sampling:
        interval_m: 300
        max_points: 500
        min_points: 40
        mode: distance_interval
      start_marker:
        color: '#5a9a63'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#120001'
        ring_color: '#5a9a63'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
  frame:
    color: '#2b0506'
    enabled: true
    padding: 0.04
  hillshade:
    alpha: 0
    altitude: 45
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gist_heat
    interpolation: bicubic
    multidirectional: true
    sigma: 1.0
    vert_exag: 1.0
    weights:
    - 1.2
    - 1.0
    - 0.8
    - 0.8
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.0
      clip_high: 1.0
      contrast: 1.0
      gamma: 1.0
      bias: 0.0
      ambient: 0.0
    tint:
      shadow_color: '#0b0f14'
      mid_color: '#5f6368'
      highlight_color: '#f3f1eb'
    multiscale:
      enabled: false
      scales:
      - sigma: 8.0
        weight: 0.65
      - sigma: 2.0
        weight: 0.35
  info:
    color: '#ffffff'
    font: Inter
    position: bottom-right
    show: false
    size: 0.01
    text: map-artistry
  info_panel:
    background:
      alpha: 1.0
      color: '#1b0708'
    elements:
    - align: left
      alpha: 1.0
      color: '#f0d6d6'
      content: BOSTON-EMERALD NECKLACE BICYCLE ADVENTURE
      font: Inter
      font_weight: bold
      id: title
      size: 0.42
      tracking: 0.1
      transform: uppercase
      type: title
      x: 0.03
      y: 0.65
    - align: left
      alpha: 1.0
      color: '#c78f8f'
      content: OLMSTED PARKS TOUR
      font: Inter
      font_weight: normal
      id: subtitle
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.03
      y: 0.25
    - align: right
      alpha: 1.0
      color: '#c78f8f'
      content: ''
      font: Inter
      font_weight: normal
      id: location
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.97
      y: 0.65
    - align: right
      font: Inter
      id: stats
      items:
      - value: 38.5 MI
        label: DISTANCE
      - value: 1,260 FT
        label: ELEV GAIN
      label_alpha: 1.0
      label_color: '#c78f8f'
      label_size: 0.1
      label_weight: normal
      layout: horizontal
      spacing: 0.04
      transform: uppercase
      type: stats
      value_alpha: 1.0
      value_color: '#f0d6d6'
      value_size: 0.22
      value_weight: bold
      x: 0.97
      y: 0.3
    enabled: true
    height: 0.12
    padding: 0.015
    position: bottom
    zorder: 1000
  satellite:
    opacity: 1.0
    visible: false
    path: downloads/routes/boston-emerald-necklace-bicycle-adventure/satellite.tif
  scheme: river_runs_red
  terrain:
    alpha: 1.0
    blend_mode: soft_light
    colors:
    - '#b71c1c'
    - '#a81518'
    - '#960f14'
    - '#820a11'
    - '#6c070e'
    - '#56050b'
    - '#420307'
    - '#280204'
    - '#120001'
