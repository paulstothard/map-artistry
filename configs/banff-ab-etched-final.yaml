# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#f2efe8'
    fc: '#f2efe8'
  debug_water_hillshade: false
  elevation_profile:
    alpha: 1.0
    color: '#2f2f2f'
    enabled: true
    height: 0.04
    route:
      alpha: 0.85
      color: '#c23b22'
      enabled: true
      end_marker:
        color: '#8c4f39'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#f2efe8'
        ring_color: '#8c4f39'
        ring_width_scale: 0.08
        size: 4.8
        style: concentric_circles
      linewidth: 4.5
      outline:
        color: '#2f2a25'
        enabled: true
        linewidth: 1.2
      sampling:
        interval_m: 300
        max_points: 500
        min_points: 40
        mode: distance_interval
      start_marker:
        color: '#3b7f59'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#f2efe8'
        ring_color: '#3b7f59'
        ring_width_scale: 0.08
        size: 4.8
        style: concentric_circles
  frame:
    color: '#5a5550'
    enabled: true
    padding: 0.04
  hillshade:
    alpha: 1.0
    altitude: 34
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gray
    interpolation: bicubic
    multidirectional: true
    multiscale:
      enabled: true
      scales:
      - sigma: 7.5
        weight: 0.68
      - sigma: 1.8
        weight: 0.32
    render_mode: cmap
    sigma: 0.0
    tint:
      highlight_color: '#f6f6f6'
      mid_color: '#8c8c8c'
      shadow_color: '#1f1f1f'
    tone:
      ambient: 0.06
      bias: 0.0
      clip_high: 0.88
      clip_low: 0.12
      contrast: 1.75
      gamma: 1.0
    unsharp_amount: 0.4
    unsharp_radius: 1.0
    vert_exag: 2.3
    weights:
    - 1.45
    - 1.0
    - 0.75
    - 0.75
    zorder: 0
  info:
    color: '#6c655d'
    font: Gill Sans
    fontsize: 8
    position: bottom-right
    show: false
    text: map-artistry
  info_panel:
    background:
      alpha: 1.0
      color: '#2f2f2f'
    elements:
    - align: left
      alpha: 1.0
      color: '#f2efe8'
      content: ''
      font: Inter
      font_weight: bold
      id: title
      size: 0.42
      tracking: 0.1
      transform: uppercase
      type: title
      x: 0.03
      y: 0.65
    - align: left
      alpha: 1.0
      color: '#d2cbc1'
      content: ''
      font: Inter
      font_weight: normal
      id: subtitle
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.03
      y: 0.25
    - align: right
      alpha: 1.0
      color: '#d2cbc1'
      content: ''
      font: Inter
      font_weight: normal
      id: location
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.97
      y: 0.65
    - align: right
      font: Inter
      id: stats
      items: []
      label_alpha: 1.0
      label_color: '#d2cbc1'
      label_size: 0.1
      label_weight: normal
      layout: horizontal
      spacing: 0.04
      transform: uppercase
      type: stats
      value_alpha: 1.0
      value_color: '#f2efe8'
      value_size: 0.22
      value_weight: bold
      x: 0.97
      y: 0.3
    enabled: false
    height: 0.12
    padding: 0.015
    position: bottom
    zorder: 1000
  satellite:
    opacity: 1.0
    visible: false
    path: downloads/regions/banff-ab/satellite.tif
  scheme: etched
  terrain:
    alpha: 1.0
    blend_mode: soft_light
    colors:
    - '#1a1a1a'
    - '#3a3a3a'
    - '#5a5a5a'
    - '#7a7a7a'
    - '#9a9a9a'
    - '#bcbcbc'
    - '#d7d7d7'
    - '#ececec'
    - '#fafafa'
    interpolation: bicubic
    percentiles:
    - 2
    - 98
    shade_strength: 0.6
    stretch: linear
    stretch_exponent: 1.0
    visible: false
    zorder: 0
  water_hillshade:
    bias: 0.01
    blur_sigma: 7.0
    contrast: 0.18
  dem: downloads/regions/banff-ab/dem.tif
