# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#000000'
    fc: '#000000'
  debug_water_hillshade: false
  elevation_profile:
    alpha: 0.92
    color: '#ffffff'
    enabled: true
    height: 0.04
    outline:
      alpha: 0.7
      color: '#ff1744'
      enabled: true
      linewidth: 0.8
    route:
      alpha: 0.95
      color: '#ffffff'
      enabled: true
      end_marker:
        color: '#ff5252'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#0a0000'
        ring_color: '#ff5252'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
      linewidth: 4.5
      outline:
        color: '#ff1744'
        enabled: true
        linewidth: 1.2
      sampling:
        interval_m: 300
        max_points: 500
        min_points: 40
        mode: distance_interval
      start_marker:
        color: '#00c853'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#0a0000'
        ring_color: '#00c853'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
  frame:
    color: '#000000'
    enabled: true
    padding: 0.04
  hillshade:
    alpha: 0
    altitude: 45
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gray
    interpolation: bicubic
    multidirectional: true
    sigma: 0.0
    unsharp_amount: 0.0
    unsharp_radius: 0.0
    vert_exag: 2.5
    weights:
    - 1.3
    - 1.0
    - 0.8
    - 0.8
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.0
      clip_high: 1.0
      contrast: 1.0
      gamma: 1.0
      bias: 0.0
      ambient: 0.0
    tint:
      shadow_color: '#0b0f14'
      mid_color: '#5f6368'
      highlight_color: '#f3f1eb'
    multiscale:
      enabled: false
      scales:
      - sigma: 8.0
        weight: 0.65
      - sigma: 2.0
        weight: 0.35
  info:
    color: '#808080'
    font: Inter
    position: bottom-right
    show: false
    size: 0.01
    text: map-artistry
  info_panel:
    background:
      alpha: 1.0
      color: '#000000'
    elements:
    - align: left
      alpha: 1.0
      color: '#ffb74d'
      content: ''
      font: Inter
      font_weight: bold
      id: title
      size: 0.42
      tracking: 0.1
      transform: uppercase
      type: title
      x: 0.03
      y: 0.65
    - align: left
      alpha: 1.0
      color: '#ff8a50'
      content: ''
      font: Inter
      font_weight: normal
      id: subtitle
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.03
      y: 0.25
    - align: right
      alpha: 1.0
      color: '#ff8a50'
      content: ''
      font: Inter
      font_weight: normal
      id: location
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.97
      y: 0.65
    - align: right
      font: Inter
      id: stats
      items: []
      label_alpha: 1.0
      label_color: '#ff8a50'
      label_size: 0.1
      label_weight: normal
      layout: horizontal
      spacing: 0.04
      transform: uppercase
      type: stats
      value_alpha: 1.0
      value_color: '#ffcc80'
      value_size: 0.22
      value_weight: bold
      x: 0.97
      y: 0.3
    enabled: false
    height: 0.12
    padding: 0.015
    position: bottom
    zorder: 1000
  satellite:
    alpha: 1.0
    visible: false
    path: downloads/regions/edmonton-ab/satellite.tif
  scheme: lava
  terrain:
    alpha: 1.0
    blend_mode: soft_light
    colors:
    - '#ffeb3b'
    - '#ff6f00'
    - '#d32f2f'
    - '#b71c1c'
    - '#8b0000'
    - '#6d1010'
    - '#5d1f1f'
    - '#4a2020'
    - '#3a1a1a'
    - '#2b1212'
    - '#1f0d0d'
    - '#120808'
    - '#0a0000'
    interpolation: nearest
    percentiles:
    - 1
    - 99.7
    shade_strength: 0.7
    stretch: gamma
    stretch_exponent: 0.85
    visible: true
    zorder: 0
  water_hillshade:
    bias: 0.0
    blur_sigma: 1.5
    contrast: 0.5
  dem: downloads/regions/edmonton-ab/dem.tif
