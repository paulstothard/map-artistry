# YAML configuration for map rendering
# zorder controls drawing order: higher values are drawn on top
# You can override default styles per feature type by editing the style_rules section
map:
  background:
    ec: '#fbfbf9'
    fc: '#fbfbf9'
  debug_water_hillshade: false
  elevation_profile:
    alpha: 0.9
    color: '#d32f2f'
    enabled: true
    height: 0.04
    outline:
      alpha: 0.7
      color: '#000000'
      enabled: true
      linewidth: 0.8
    route:
      alpha: 0.95
      color: '#d32f2f'
      enabled: true
      end_marker:
        color: '#b23a2a'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#fbfbf9'
        ring_color: '#b23a2a'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
      linewidth: 4.5
      outline:
        color: '#000000'
        enabled: true
        linewidth: 1.2
      sampling:
        interval_m: 300
        max_points: 500
        min_points: 40
        mode: distance_interval
      start_marker:
        color: '#2e7d32'
        core_edge_width_scale: 0.035
        core_radius_scale: 0.17
        fill_color: '#fbfbf9'
        ring_color: '#2e7d32'
        ring_width_scale: 0.14
        size: 16.0
        style: concentric_circles
  frame:
    alpha: 0.35
    color: '#b08f8f'
    ec: '#b08f8f'
    enabled: true
    fc: '#b08f8f'
    padding: 0.04
  hillshade:
    alpha: 1.0
    altitude: 36
    azimuth: 315
    azimuths:
    - 315
    - 45
    - 270
    - 90
    cmap: gray
    interpolation: bicubic
    multidirectional: true
    multiscale:
      enabled: true
      scales:
      - sigma: 9.5
        weight: 0.7
      - sigma: 2.5
        weight: 0.3
    render_mode: tinted
    sigma: 0.0
    tint:
      highlight_color: '#ffffff'
      mid_color: '#efefeb'
      shadow_color: '#d4d5d1'
    tone:
      ambient: 0.42
      bias: 0.0
      clip_high: 0.9
      clip_low: 0.03
      contrast: 0.86
      gamma: 1.06
    unsharp_amount: 0.32
    unsharp_radius: 1.5
    vert_exag: 1.9
    weights:
    - 1.15
    - 1.0
    - 0.85
    - 0.85
    zorder: 0
  info:
    color: '#b8b8b2'
    font: Inter
    position: bottom-right
    show: false
    size: 0.01
    text: map-artistry
  info_panel:
    background:
      alpha: 1.0
      color: '#4a4a45'
    elements:
    - align: left
      alpha: 1.0
      color: '#ffffff'
      content: ''
      font: Inter
      font_weight: bold
      id: title
      size: 0.42
      tracking: 0.1
      transform: uppercase
      type: title
      x: 0.03
      y: 0.65
    - align: left
      alpha: 1.0
      color: '#e5e5dd'
      content: ''
      font: Inter
      font_weight: normal
      id: subtitle
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.03
      y: 0.25
    - align: right
      alpha: 1.0
      color: '#e5e5dd'
      content: ''
      font: Inter
      font_weight: normal
      id: location
      size: 0.14
      tracking: 0.06
      transform: uppercase
      type: text
      x: 0.97
      y: 0.65
    - align: right
      font: Inter
      id: stats
      items: []
      label_alpha: 1.0
      label_color: '#e5e5dd'
      label_size: 0.1
      label_weight: normal
      layout: horizontal
      spacing: 0.04
      transform: uppercase
      type: stats
      value_alpha: 1.0
      value_color: '#ffffff'
      value_size: 0.22
      value_weight: bold
      x: 0.97
      y: 0.3
    enabled: false
    height: 0.12
    padding: 0.015
    position: bottom
    zorder: 1000
  satellite:
    alpha: 1.0
    visible: false
    path: downloads/regions/patagonia/satellite.tif
  scheme: minimal_white
  terrain:
    alpha: 1.0
    blend_mode: soft_light
    colors:
    - '#d9dad5'
    - '#e0e1dc'
    - '#e6e7e2'
    - '#ebece7'
    - '#efefeb'
    - '#f2f2ee'
    - '#f5f5f1'
    - '#f8f8f5'
    - '#ffffff'
    interpolation: bicubic
    percentiles:
    - 2
    - 98
    shade_strength: 0.6
    stretch: linear
    stretch_exponent: 1.0
    visible: false
    zorder: 0
  water_hillshade:
    bias: 0.01
    blur_sigma: 8.0
    contrast: 0.12
  dem: downloads/regions/patagonia/dem.tif
