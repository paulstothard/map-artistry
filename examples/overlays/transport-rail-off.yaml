# Turn off transport and rail-like layers when present.
layers:
  transport:
    visible: false
  transport__LineString:
    visible: false
  transport__MultiLineString:
    visible: false
  rail:
    visible: false
  rail__LineString:
    visible: false
  rail__MultiLineString:
    visible: false
  railway:
    visible: false
  railway__LineString:
    visible: false
  railway__MultiLineString:
    visible: false
