map:
  background:
    fc: '#dfe7d6'
    ec: '#dfe7d6'
  frame:
    enabled: true
    color: '#2f3b2f'
    padding: 0.04
  scheme: natural
  debug_water_hillshade: true
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#2f3b2f'
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.3
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 1.2
    cmap: gray
    alpha: 0
    sigma: 0.6
    unsharp_radius: 1.0
    unsharp_amount: 0.7
    interpolation: bicubic
    zorder: 0
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.6
    bias: 0.0
  terrain:
    visible: true
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    blend_mode: soft_light
    shade_strength: 0.45
    interpolation: bicubic
    colors:
    - '#4a8c4a'
    - '#6ba05a'
    - '#8fb46b'
    - '#b3c87a'
    - '#d4c87a'
    - '#c8a850'
    - '#b08040'
    - '#8c5820'
    - '#6e3c10'
    - '#8a7868'
    - '#b0a090'
    - '#d8d0c8'
    - '#ffffff'
  satellite:
    visible: false
    alpha: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#1f3a2b'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f3f7ef'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#d5e2cf'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#d5e2cf'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f3f7ef'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#d5e2cf'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#f7fbe9'
    alpha: 0.9
    outline:
      enabled: true
      color: '#284932'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#f7fbe9'
      linewidth: 4.0
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#284932'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#3f7c4c'
        ring_color: '#3f7c4c'
        fill_color: '#dfe7d6'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#8c3b2a'
        ring_color: '#8c3b2a'
        fill_color: '#dfe7d6'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
