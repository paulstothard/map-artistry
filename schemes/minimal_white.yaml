map:
  background:
    fc: "#fbfbf9"
    ec: "#fbfbf9"
  scheme: minimal_white
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#b8b8b2"
  hillshade:
    azimuth: 315
    altitude: 36
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.15
      - 1.0
      - 0.85
      - 0.85
    multidirectional: true
    vert_exag: 1.9
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.5
    unsharp_amount: 0.32
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.03
      clip_high: 0.90
      contrast: 0.86
      gamma: 1.06
      bias: 0.0
      ambient: 0.42
    tint:
      shadow_color: "#d4d5d1"
      mid_color: "#efefeb"
      highlight_color: "#ffffff"
    multiscale:
      enabled: true
      scales:
        - sigma: 9.5
          weight: 0.70
        - sigma: 2.5
          weight: 0.30
  water_hillshade:
    blur_sigma: 8.0
    contrast: 0.12
    bias: 0.01
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#d9dad5"
      - "#e0e1dc"
      - "#e6e7e2"
      - "#ebece7"
      - "#efefeb"
      - "#f2f2ee"
      - "#f5f5f1"
      - "#f8f8f5"
      - "#ffffff"
  satellite:
    visible: false
    opacity: 1.0

