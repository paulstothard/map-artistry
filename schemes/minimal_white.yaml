map:
  background:
    fc: "#fbfbf9"
    ec: "#fbfbf9"
  frame:
    enabled: true
    color: "#8b8b84"
    padding: 0.04
  scheme: minimal_white
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#b8b8b2"
  hillshade:
    azimuth: 315
    altitude: 36
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.15
      - 1.0
      - 0.85
      - 0.85
    multidirectional: true
    vert_exag: 1.9
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.5
    unsharp_amount: 0.32
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.03
      clip_high: 0.9
      contrast: 0.86
      gamma: 1.06
      bias: 0.0
      ambient: 0.42
    tint:
      shadow_color: "#d4d5d1"
      mid_color: "#efefeb"
      highlight_color: "#ffffff"
    multiscale:
      enabled: true
      scales:
        - sigma: 9.5
          weight: 0.7
        - sigma: 2.5
          weight: 0.3
  water_hillshade:
    blur_sigma: 8.0
    contrast: 0.12
    bias: 0.01
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#d9dad5"
      - "#e0e1dc"
      - "#e6e7e2"
      - "#ebece7"
      - "#efefeb"
      - "#f2f2ee"
      - "#f5f5f1"
      - "#f8f8f5"
      - "#ffffff"
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: "#4a4a45"
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
      - type: title
        id: title
        content: ""
        x: 0.03
        y: 0.65
        font: Inter
        font_weight: bold
        size: 0.42
        color: "#ffffff"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.10
      - type: text
        id: subtitle
        content: ""
        x: 0.03
        y: 0.25
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#e5e5dd"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.06
      - type: text
        id: location
        content: ""
        x: 0.97
        y: 0.65
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#e5e5dd"
        alpha: 1.0
        align: right
        transform: uppercase
        tracking: 0.06
      - type: stats
        id: stats
        items: []
        x: 0.97
        y: 0.30
        align: right
        layout: horizontal
        spacing: 0.04
        font: Inter
        value_size: 0.22
        value_weight: bold
        value_color: "#ffffff"
        value_alpha: 1.0
        label_size: 0.10
        label_weight: normal
        label_color: "#e5e5dd"
        label_alpha: 1.0
        transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: "#4a4a45"
    alpha: 0.9
    route:
      enabled: true
      color: "#b22222"
      linewidth: 4.0
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: "#ffffff"
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: "#2e7d32"
        ring_color: "#2e7d32"
        fill_color: "#fbfbf9"
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: "#b23a2a"
        ring_color: "#b23a2a"
        fill_color: "#fbfbf9"
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
