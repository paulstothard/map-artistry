map:
  background:
    fc: '#000000'
    ec: '#000000'
  frame:
    enabled: true
    color: '#000000'
    padding: 0.04
  scheme: lava
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#808080'
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.3
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 2.5
    cmap: gray
    alpha: 0
    sigma: 0.0
    unsharp_radius: 0.0
    unsharp_amount: 0.0
    interpolation: bicubic
    zorder: 0
  water_hillshade:
    blur_sigma: 1.5
    contrast: 0.5
    bias: 0.0
  terrain:
    visible: true
    alpha: 1.0
    zorder: 0
    percentiles:
    - 1
    - 99.7
    stretch: gamma
    stretch_exponent: 0.85
    blend_mode: soft_light
    shade_strength: 0.7
    interpolation: nearest
    colors:
    - '#ffeb3b'
    - '#ff6f00'
    - '#d32f2f'
    - '#b71c1c'
    - '#8b0000'
    - '#6d1010'
    - '#5d1f1f'
    - '#4a2020'
    - '#3a1a1a'
    - '#2b1212'
    - '#1f0d0d'
    - '#120808'
    - '#0a0000'
  satellite:
    visible: false
    alpha: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#000000'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#ffb74d'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#ff8a50'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#ff8a50'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#ffcc80'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#ff8a50'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#ffffff'
    alpha: 0.92
    outline:
      enabled: true
      color: '#ff1744'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#ffffff'
      linewidth: 4.5
      alpha: 0.95
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#ff1744'
        linewidth: 1.2
      start_marker:
        style: concentric_circles
        color: '#00c853'
        ring_color: '#00c853'
        fill_color: '#0a0000'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#ff5252'
        ring_color: '#ff5252'
        fill_color: '#0a0000'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
