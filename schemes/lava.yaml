    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.3
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 2.5
    cmap: gray
    alpha: 0
    sigma: 0.0
    unsharp_radius: 2.0
    unsharp_amount: 1.0
