map:
  background:
    fc: '#000000'
    ec: '#000000'
  scheme: lava
  debug_water_hillshade: false
  info:
    text: ps
    show: true
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: '#808080'
  hillshade:
    azimuth: 315
    altitude: 45
