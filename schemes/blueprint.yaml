map:
  background:
    fc: "#071724"
    ec: "#071724"
  scheme: blueprint
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#8ecae6"
  hillshade:
    azimuth: 315
    altitude: 35
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.10
      - 1.0
      - 0.85
      - 0.85
    multidirectional: true
    vert_exag: 1.55
    cmap: gray
    alpha: 0.72
    sigma: 0.0
    unsharp_radius: 1.2
    unsharp_amount: 0.28
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.10
      clip_high: 0.90
      contrast: 0.78
      gamma: 1.08
      bias: 0.0
      ambient: 0.34
    tint:
      shadow_color: "#123042"
      mid_color: "#4f89ab"
      highlight_color: "#9fd7ef"
    multiscale:
      enabled: true
      scales:
        - sigma: 8.0
          weight: 0.64
        - sigma: 2.0
          weight: 0.36
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.18
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#0a2234"
      - "#13364e"
      - "#1c4b68"
      - "#2f6384"
      - "#4b81a5"
      - "#70a4c4"
      - "#94c5df"
      - "#bee3f4"
      - "#e6fbff"
  satellite:
    visible: false
    opacity: 1.0

