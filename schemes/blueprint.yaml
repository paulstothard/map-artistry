map:
  background:
    fc: '#071724'
    ec: '#071724'
  frame:
    enabled: true
    color: '#123d57'
    padding: 0.04
  scheme: blueprint
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#8ecae6'
  hillshade:
    azimuth: 315
    altitude: 35
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.1
    - 1.0
    - 0.85
    - 0.85
    multidirectional: true
    vert_exag: 1.55
    cmap: gray
    alpha: 0.0
    sigma: 0.0
    unsharp_radius: 1.2
    unsharp_amount: 0.28
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.1
      clip_high: 0.9
      contrast: 0.78
      gamma: 1.08
      bias: 0.0
      ambient: 0.34
    tint:
      shadow_color: '#123042'
      mid_color: '#4f89ab'
      highlight_color: '#9fd7ef'
    multiscale:
      enabled: true
      scales:
      - sigma: 8.0
        weight: 0.64
      - sigma: 2.0
        weight: 0.36
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.18
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#0a2234'
    - '#13364e'
    - '#1c4b68'
    - '#2f6384'
    - '#4b81a5'
    - '#70a4c4'
    - '#94c5df'
    - '#bee3f4'
    - '#e6fbff'
  satellite:
    visible: false
    alpha: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#123d57'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#e6fbff'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#b8e7f5'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#b8e7f5'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#e6fbff'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#b8e7f5'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#ffd166'
    alpha: 1.0
    outline:
      enabled: true
      color: '#071724'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#ffd166'
      linewidth: 4.0
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#071724'
        linewidth: 1.3
      start_marker:
        style: concentric_circles
        color: '#5fbf9b'
        ring_color: '#5fbf9b'
        fill_color: '#071724'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#ff7b7b'
        ring_color: '#ff7b7b'
        fill_color: '#071724'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
