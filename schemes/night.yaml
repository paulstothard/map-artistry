map:
  background:
    fc: '#070a0f'
    ec: '#070a0f'
  frame:
    enabled: true
    color: '#1a1a1a'
    padding: 0.04
  scheme: night
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#f2e9d8'
  hillshade:
    azimuth: 315
    altitude: 34
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.3
    - 1.0
    - 0.7
    - 0.7
    multidirectional: true
    vert_exag: 1.4
    cmap: gray
    alpha: 0.12
    sigma: 0.0
    unsharp_radius: 0.6
    unsharp_amount: 0.2
    interpolation: bicubic
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.18
      clip_high: 0.97
      contrast: 1.55
      gamma: 0.92
      bias: 0.0
      ambient: 0.1
    tint:
      shadow_color: '#010203'
      mid_color: '#08141b'
      highlight_color: '#52f7ff'
    multiscale:
      enabled: true
      scales:
      - sigma: 6.5
        weight: 0.58
      - sigma: 1.4
        weight: 0.42
  water_hillshade:
    blur_sigma: 7.0
    contrast: 0.25
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#010203'
    - '#041017'
    - '#061720'
    - '#0a2430'
    - '#0f3441'
    - '#184a58'
    - '#246f7c'
    - '#35a9b2'
    - '#63ffff'
  satellite:
    visible: false
    alpha: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#1a1a1a'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f0f0f0'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#c0c0c0'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#c0c0c0'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f0f0f0'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#c0c0c0'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#ffeb3b'
    alpha: 0.9
    outline:
      enabled: true
      color: '#1a1a1a'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#ffeb3b'
      linewidth: 4.0
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#1a1a1a'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#64d977'
        ring_color: '#64d977'
        fill_color: '#020304'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#ff5c93'
        ring_color: '#ff5c93'
        fill_color: '#020304'
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
