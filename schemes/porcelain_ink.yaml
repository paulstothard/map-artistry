map:
  background:
    fc: '#f9f9f6'
    ec: '#f9f9f6'
  frame:
    enabled: true
    color: '#3a4048'
    padding: 0.04
  scheme: porcelain_ink
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#9a9a93'
  hillshade:
    azimuth: 315
    altitude: 36
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.15
    - 1.0
    - 0.85
    - 0.85
    multidirectional: true
    vert_exag: 1.9
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.4
    unsharp_amount: 0.3
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.04
      clip_high: 0.88
      contrast: 0.95
      gamma: 1.04
      bias: 0.0
      ambient: 0.36
    tint:
      shadow_color: '#d6d7d2'
      mid_color: '#efefea'
      highlight_color: '#ffffff'
    multiscale:
      enabled: true
      scales:
      - sigma: 9.5
        weight: 0.7
      - sigma: 2.5
        weight: 0.3
  water_hillshade:
    blur_sigma: 8.0
    contrast: 0.1
    bias: 0.01
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#d9dad5'
    - '#e0e1dc'
    - '#e6e7e2'
    - '#ebece7'
    - '#efefea'
    - '#f2f2ee'
    - '#f5f5f1'
    - '#f8f8f5'
    - '#ffffff'
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#f1efe8'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#232a31'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#56606b'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#56606b'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#232a31'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#56606b'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#4f6078'
    alpha: 0.9
    route:
      enabled: true
      color: '#4f6078'
      linewidth: 4.0
      alpha: 0.95
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#ffffff'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#6f8a7a'
        ring_color: '#6f8a7a'
        fill_color: '#ffffff'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#9a6f64'
        ring_color: '#9a6f64'
        fill_color: '#ffffff'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
