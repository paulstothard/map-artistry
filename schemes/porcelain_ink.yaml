waterway:
  fc: "#a9c3cb"
  ec: "#a9c3cb"
  alpha: 0.80
  ew: 0
  zorder: 3
  visible: true
  geometry_visibility:
    Point: false
    MultiPoint: false
    LineString: true
    MultiLineString: true
    Polygon: true
    MultiPolygon: true
  palette: []
  # Line weights in points (pt): 1 pt = 1/72 inch physical
  # At 300 DPI: 0.6 pt = 0.008" physical, 0.2 pt = 0.003" physical
  lw:
    river: 0.6
    canal: 0.0
    stream: 0.2
    drain: 0.0
    ditch: 0.0
    moat: 0.0
    rapids: 0.0
  default_lw: 0.2

road:
  fc: "#111111"
  ec: "#111111"
  alpha: 0.72
  ew: 0
  zorder: 6
  visible: true
  geometry_visibility:
    Point: false
    MultiPoint: false
    LineString: true
    MultiLineString: true
    Polygon: false
    MultiPolygon: false
  palette: []
  # Line weights in points (pt): 1 pt = 1/72 inch physical
  # Physical widths remain constant regardless of canvas size or DPI
  # Minimum 0.15 pt to ensure visibility on all prints
  lw:
    motorway: 0.8 # 0.011" physical
    trunk: 0.7 # 0.010" physical
    primary: 0.6 # 0.008" physical
    secondary: 0.5 # 0.007" physical
    tertiary: 0.4 # 0.006" physical
    residential: 0.25 # 0.003" physical
    unclassified: 0.25 # 0.003" physical
    service: 0.15 # 0.002" physical (minimum)
    living_street: 0.15
    track: 0.15
  default_lw: 0.15

