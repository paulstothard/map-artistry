map:
  background:
    fc: "#8f1f46"
    ec: "#8f1f46"
  frame:
    enabled: true
    color: "#6b2a3f"
    padding: 0.04
  scheme: burgundy
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: "#d4a0b0"
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.2
      - 1.0
      - 0.8
      - 0.8
    multidirectional: true
    vert_exag: 1.0
    cmap: gist_heat
    alpha: 0
    sigma: 1.0
    interpolation: bicubic
    zorder: 0
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    blend_mode: soft_light
    shade_strength: 0.4
    interpolation: bicubic
    colors:
      - "#6b2a3f"
      - "#7a3447"
      - "#893e4f"
      - "#984857"
      - "#a7525f"
      - "#b65c67"
      - "#c5666f"
      - "#d47077"
      - "#e37a7f"
  satellite:
    visible: false
    alpha: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: "#32131f"
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
      - type: title
        id: title
        content: ""
        x: 0.03
        y: 0.65
        font: Inter
        font_weight: bold
        size: 0.42
        color: "#d4a0b0"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.10
      - type: text
        id: subtitle
        content: ""
        x: 0.03
        y: 0.25
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#c48599"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.06
      - type: text
        id: location
        content: ""
        x: 0.97
        y: 0.65
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#c48599"
        alpha: 1.0
        align: right
        transform: uppercase
        tracking: 0.06
      - type: stats
        id: stats
        items: []
        x: 0.97
        y: 0.30
        align: right
        layout: horizontal
        spacing: 0.04
        font: Inter
        value_size: 0.22
        value_weight: bold
        value_color: "#d4a0b0"
        value_alpha: 1.0
        label_size: 0.10
        label_weight: normal
        label_color: "#c48599"
        label_alpha: 1.0
        transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: "#32131f"
    alpha: 1.0
    outline:
      enabled: true
      color: "#ffffff"
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: "#32131f"
      linewidth: 5.5
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: "#ffffff"
        linewidth: 1.5
      start_marker:
        style: concentric_circles
        color: "#6b2a3f"
        ring_color: "#6b2a3f"
        fill_color: "#ffffff"
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: "#6b2a3f"
        ring_color: "#6b2a3f"
        fill_color: "#ffffff"
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
