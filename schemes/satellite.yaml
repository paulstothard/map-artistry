map:
  background:
    fc: '#05050d'
    ec: '#05050d'
  frame:
    enabled: true
    color: '#2a2f35'
    padding: 0.04
  scheme: satellite
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#000000'
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.2
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 1.0
    cmap: gist_heat
    alpha: 0
    sigma: 1.0
    interpolation: bicubic
    zorder: 0
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#132B43'
    - '#255D83'
    - '#4D8DA6'
    - '#7FAE7B'
    - '#B8C98A'
    - '#D7C29E'
    - '#A9835A'
    - '#7A5D45'
    - '#F2F1ED'
  satellite:
    visible: true
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#101418'
      alpha: 0.88
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f3f5f7'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#b8c2cc'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#b8c2cc'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f3f5f7'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#b8c2cc'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#ffd54f'
    alpha: 0.9
    outline:
      enabled: true
      color: '#1a1a1a'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#ffd54f'
      linewidth: 4.0
      alpha: 0.92
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#1a1a1a'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#72c78b'
        ring_color: '#72c78b'
        fill_color: '#ffffff'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#ff6b6b'
        ring_color: '#ff6b6b'
        fill_color: '#ffffff'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
