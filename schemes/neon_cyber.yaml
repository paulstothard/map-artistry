map:
  background:
    fc: "#020304"
    ec: "#020304"
  frame:
    enabled: true
    color: "#67f8ff"
    padding: 0.04
  scheme: neon_cyber
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#67f8ff"
  hillshade:
    azimuth: 315
    altitude: 34
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.3
      - 1.0
      - 0.7
      - 0.7
    multidirectional: true
    vert_exag: 2.5
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.1
    unsharp_amount: 0.7
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.18
      clip_high: 0.97
      contrast: 1.55
      gamma: 0.92
      bias: 0.0
      ambient: 0.1
    tint:
      shadow_color: "#010203"
      mid_color: "#08141b"
      highlight_color: "#52f7ff"
    multiscale:
      enabled: true
      scales:
        - sigma: 6.5
          weight: 0.58
        - sigma: 1.4
          weight: 0.42
  water_hillshade:
    blur_sigma: 7.0
    contrast: 0.25
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#010203"
      - "#041017"
      - "#061720"
      - "#0a2430"
      - "#0f3441"
      - "#184a58"
      - "#246f7c"
      - "#35a9b2"
      - "#63ffff"
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: "#63ffff"
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
      - type: title
        id: title
        content: ""
        x: 0.03
        y: 0.65
        font: Inter
        font_weight: bold
        size: 0.42
        color: "#020304"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.10
      - type: text
        id: subtitle
        content: ""
        x: 0.03
        y: 0.25
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#0a1a20"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.06
      - type: text
        id: location
        content: ""
        x: 0.97
        y: 0.65
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#0a1a20"
        alpha: 1.0
        align: right
        transform: uppercase
        tracking: 0.06
      - type: stats
        id: stats
        items: []
        x: 0.97
        y: 0.30
        align: right
        layout: horizontal
        spacing: 0.04
        font: Inter
        value_size: 0.22
        value_weight: bold
        value_color: "#020304"
        value_alpha: 1.0
        label_size: 0.10
        label_weight: normal
        label_color: "#0a1a20"
        label_alpha: 1.0
        transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: "#63ffff"
    alpha: 0.9
    route:
      enabled: true
      color: "#ff5cf0"
      linewidth: 4.0
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: "#07141b"
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: "#64d977"
        ring_color: "#64d977"
        fill_color: "#020304"
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: "#ff5c93"
        ring_color: "#ff5c93"
        fill_color: "#020304"
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
