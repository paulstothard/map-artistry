map:
  background:
    fc: "#020304"
    ec: "#020304"
  scheme: neon_cyber
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#67f8ff"
  hillshade:
    azimuth: 315
    altitude: 34
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.30
      - 1.0
      - 0.70
      - 0.70
    multidirectional: true
    vert_exag: 2.5
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.1
    unsharp_amount: 0.70
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.18
      clip_high: 0.97
      contrast: 1.55
      gamma: 0.92
      bias: 0.0
      ambient: 0.10
    tint:
      shadow_color: "#010203"
      mid_color: "#08141b"
      highlight_color: "#52f7ff"
    multiscale:
      enabled: true
      scales:
        - sigma: 6.5
          weight: 0.58
        - sigma: 1.4
          weight: 0.42
  water_hillshade:
    blur_sigma: 7.0
    contrast: 0.25
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#010203"
      - "#041017"
      - "#061720"
      - "#0a2430"
      - "#0f3441"
      - "#184a58"
      - "#246f7c"
      - "#35a9b2"
      - "#63ffff"
  satellite:
    visible: false
    opacity: 1.0

