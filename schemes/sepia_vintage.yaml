map:
  background:
    fc: '#f3eadb'
    ec: '#f3eadb'
  frame:
    enabled: true
    color: '#6f563d'
    padding: 0.04
  scheme: sepia_vintage
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#8a7358'
  hillshade:
    azimuth: 315
    altitude: 33
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.25
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 1.4
    cmap: gray
    alpha: 0.12
    sigma: 0.0
    unsharp_radius: 0.6
    unsharp_amount: 0.2
    interpolation: bicubic
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.08
      clip_high: 0.92
      contrast: 1.02
      gamma: 1.03
      bias: 0.0
      ambient: 0.28
    tint:
      shadow_color: '#3a2a1f'
      mid_color: '#9a7756'
      highlight_color: '#ead8bc'
    multiscale:
      enabled: true
      scales:
      - sigma: 8.5
        weight: 0.66
      - sigma: 2.2
        weight: 0.34
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.2
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#4a3425'
    - '#6d4f39'
    - '#8b6549'
    - '#aa7c57'
    - '#c29468'
    - '#d6b487'
    - '#e2c9a3'
    - '#ecdabb'
    - '#f6ead5'
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#5c4633'
      alpha: 0.96
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f7e9d1'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#dcbf95'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#dcbf95'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f7e9d1'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#dcbf95'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#c24b2f'
    alpha: 0.92
    outline:
      enabled: true
      color: '#f3e6cf'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#c24b2f'
      linewidth: 4.6
      alpha: 0.92
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#f3e6cf'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#4f8a5b'
        ring_color: '#4f8a5b'
        fill_color: '#f3eadb'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#a0522d'
        ring_color: '#a0522d'
        fill_color: '#f3eadb'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
