map:
  background:
    fc: "#f3eadb"
    ec: "#f3eadb"
  scheme: sepia_vintage
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#8a7358"
  hillshade:
    azimuth: 315
    altitude: 33
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.25
      - 1.0
      - 0.8
      - 0.8
    multidirectional: true
    vert_exag: 2.1
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.3
    unsharp_amount: 0.42
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.08
      clip_high: 0.92
      contrast: 1.02
      gamma: 1.03
      bias: 0.0
      ambient: 0.28
    tint:
      shadow_color: "#3a2a1f"
      mid_color: "#9a7756"
      highlight_color: "#ead8bc"
    multiscale:
      enabled: true
      scales:
        - sigma: 8.5
          weight: 0.66
        - sigma: 2.2
          weight: 0.34
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.20
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#4a3425"
      - "#6d4f39"
      - "#8b6549"
      - "#aa7c57"
      - "#c29468"
      - "#d6b487"
      - "#e2c9a3"
      - "#ecdabb"
      - "#f6ead5"
  satellite:
    visible: false
    opacity: 1.0

