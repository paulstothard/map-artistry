map:
  background:
    fc: "#050608"
    ec: "#050608"
  scheme: dark_relief
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#7e848c"
  hillshade:
    azimuth: 315
    altitude: 32
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.35
      - 1.0
      - 0.7
      - 0.7
    multidirectional: true
    vert_exag: 2.4
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.4
    unsharp_amount: 0.55
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.08
      clip_high: 0.92
      contrast: 1.15
      gamma: 1.05
      bias: 0.0
      ambient: 0.20
    tint:
      shadow_color: "#11151a"
      mid_color: "#6a6f75"
      highlight_color: "#e6e3da"
    multiscale:
      enabled: true
      scales:
        - sigma: 9.0
          weight: 0.62
        - sigma: 2.2
          weight: 0.38
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.28
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#132B43"
      - "#255D83"
      - "#4D8DA6"
      - "#7FAE7B"
      - "#B8C98A"
      - "#D7C29E"
      - "#A9835A"
      - "#7A5D45"
      - "#F2F1ED"
  satellite:
    visible: false
    opacity: 1.0

