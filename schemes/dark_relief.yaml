map:
  background:
    fc: '#050608'
    ec: '#050608'
  frame:
    enabled: true
    color: '#2a2e33'
    padding: 0.04
  scheme: dark_relief
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: '#7e848c'
  hillshade:
    azimuth: 315
    altitude: 32
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.35
    - 1.0
    - 0.7
    - 0.7
    multidirectional: true
    vert_exag: 2.4
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.4
    unsharp_amount: 0.55
    interpolation: bicubic
    zorder: 0
    render_mode: tinted
    tone:
      clip_low: 0.08
      clip_high: 0.92
      contrast: 1.15
      gamma: 1.05
      bias: 0.0
      ambient: 0.2
    tint:
      shadow_color: '#11151a'
      mid_color: '#6a6f75'
      highlight_color: '#e6e3da'
    multiscale:
      enabled: true
      scales:
      - sigma: 9.0
        weight: 0.62
      - sigma: 2.2
        weight: 0.38
  water_hillshade:
    blur_sigma: 6.0
    contrast: 0.28
    bias: 0.02
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#132B43'
    - '#255D83'
    - '#4D8DA6'
    - '#7FAE7B'
    - '#B8C98A'
    - '#D7C29E'
    - '#A9835A'
    - '#7A5D45'
    - '#F2F1ED'
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#2a2e33'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f5f1e8'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#cfd3d7'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#cfd3d7'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f5f1e8'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#cfd3d7'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#353a40'
    alpha: 1.0
    route:
      enabled: true
      color: '#ff9a8f'
      linewidth: 4.8
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#ffffff'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#69b89a'
        ring_color: '#69b89a'
        fill_color: '#0d1117'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#ff8a80'
        ring_color: '#ff8a80'
        fill_color: '#0d1117'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
