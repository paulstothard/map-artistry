map:
  background:
    fc: "#f2efe8"
    ec: "#f2efe8"
  scheme: etched
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: "#6c655d"
  hillshade:
    azimuth: 315
    altitude: 34
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.45
      - 1.0
      - 0.75
      - 0.75
    multidirectional: true
    vert_exag: 2.3
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.0
    unsharp_amount: 0.40
    interpolation: bicubic
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.12
      clip_high: 0.88
      contrast: 1.75
      gamma: 1.0
      bias: 0.0
      ambient: 0.06
    tint:
      shadow_color: "#1f1f1f"
      mid_color: "#8c8c8c"
      highlight_color: "#f6f6f6"
    multiscale:
      enabled: true
      scales:
        - sigma: 7.5
          weight: 0.68
        - sigma: 1.8
          weight: 0.32
  water_hillshade:
    blur_sigma: 7.0
    contrast: 0.18
    bias: 0.01
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
      - "#1a1a1a"
      - "#3a3a3a"
      - "#5a5a5a"
      - "#7a7a7a"
      - "#9a9a9a"
      - "#bcbcbc"
      - "#d7d7d7"
      - "#ececec"
      - "#fafafa"
  satellite:
    visible: false
    opacity: 1.0

