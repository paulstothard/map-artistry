map:
  background:
    fc: '#f2efe8'
    ec: '#f2efe8'
  frame:
    enabled: true
    color: '#c9beb0'
    padding: 0.04
    fc: '#c9beb0'
    ec: '#c9beb0'
    alpha: 0.45
  scheme: etched
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Gill Sans
    fontsize: 8
    color: '#6c655d'
  hillshade:
    azimuth: 315
    altitude: 34
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.45
    - 1.0
    - 0.75
    - 0.75
    multidirectional: true
    vert_exag: 2.3
    cmap: gray
    alpha: 1.0
    sigma: 0.0
    unsharp_radius: 1.0
    unsharp_amount: 0.4
    interpolation: bicubic
    zorder: 0
    render_mode: cmap
    tone:
      clip_low: 0.12
      clip_high: 0.88
      contrast: 1.75
      gamma: 1.0
      bias: 0.0
      ambient: 0.06
    tint:
      shadow_color: '#1f1f1f'
      mid_color: '#8c8c8c'
      highlight_color: '#f6f6f6'
    multiscale:
      enabled: true
      scales:
      - sigma: 7.5
        weight: 0.68
      - sigma: 1.8
        weight: 0.32
  water_hillshade:
    blur_sigma: 7.0
    contrast: 0.18
    bias: 0.01
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    stretch: linear
    stretch_exponent: 1.0
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#1a1a1a'
    - '#3a3a3a'
    - '#5a5a5a'
    - '#7a7a7a'
    - '#9a9a9a'
    - '#bcbcbc'
    - '#d7d7d7'
    - '#ececec'
    - '#fafafa'
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#2f2f2f'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f2efe8'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#d2cbc1'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#d2cbc1'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f2efe8'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#d2cbc1'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#2f2f2f'
    alpha: 1.0
    route:
      enabled: true
      color: '#ff5a3a'
      linewidth: 5.5
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#ffffff'
        linewidth: 1.5
      start_marker:
        style: concentric_circles
        color: '#3b7f59'
        ring_color: '#3b7f59'
        fill_color: '#f2efe8'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#8c4f39'
        ring_color: '#8c4f39'
        fill_color: '#f2efe8'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
