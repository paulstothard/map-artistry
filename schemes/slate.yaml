map:
  background:
    fc: "#446f8d"
    ec: "#446f8d"
  frame:
    enabled: true
    color: "#2c4a62"
    padding: 0.04
  scheme: slate
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: "#9eb3c5"
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
      - 315
      - 45
      - 270
      - 90
    weights:
      - 1.2
      - 1.0
      - 0.8
      - 0.8
    multidirectional: true
    vert_exag: 1.0
    cmap: gist_heat
    alpha: 0
    sigma: 1.0
    interpolation: bicubic
    zorder: 0
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
      - 2
      - 98
    blend_mode: soft_light
    shade_strength: 0.4
    interpolation: bicubic
    colors:
      - "#1a252f"
      - "#2c3e50"
      - "#37474f"
      - "#455a64"
      - "#546e7a"
      - "#607d8b"
      - "#78909c"
      - "#90a4ae"
      - "#b0bec5"
  satellite:
    visible: false
    alpha: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: "#22384a"
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
      - type: title
        id: title
        content: ""
        x: 0.03
        y: 0.65
        font: Inter
        font_weight: bold
        size: 0.42
        color: "#b4c3cf"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.10
      - type: text
        id: subtitle
        content: ""
        x: 0.03
        y: 0.25
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#8fa4b6"
        alpha: 1.0
        align: left
        transform: uppercase
        tracking: 0.06
      - type: text
        id: location
        content: ""
        x: 0.97
        y: 0.65
        font: Inter
        font_weight: normal
        size: 0.14
        color: "#8fa4b6"
        alpha: 1.0
        align: right
        transform: uppercase
        tracking: 0.06
      - type: stats
        id: stats
        items: []
        x: 0.97
        y: 0.30
        align: right
        layout: horizontal
        spacing: 0.04
        font: Inter
        value_size: 0.22
        value_weight: bold
        value_color: "#b4c3cf"
        value_alpha: 1.0
        label_size: 0.10
        label_weight: normal
        label_color: "#8fa4b6"
        label_alpha: 1.0
        transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: "#22384a"
    alpha: 1.0
    outline:
      enabled: true
      color: "#ffffff"
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: "#22384a"
      linewidth: 5.5
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: "#ffffff"
        linewidth: 1.5
      start_marker:
        style: concentric_circles
        color: "#ff6a00"
        ring_color: "#ff6a00"
        fill_color: "#ffffff"
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: "#ff6a00"
        ring_color: "#ff6a00"
        fill_color: "#ffffff"
        size: 16.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
