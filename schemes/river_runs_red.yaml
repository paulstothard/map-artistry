map:
  background:
    fc: '#000000'
    ec: '#000000'
  frame:
    enabled: true
    color: '#2b0506'
    padding: 0.04
  scheme: river_runs_red
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#ffffff'
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.2
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 1.0
    cmap: gist_heat
    alpha: 0
    sigma: 1.0
    interpolation: bicubic
    zorder: 0
  terrain:
    visible: false
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    blend_mode: soft_light
    shade_strength: 0.6
    interpolation: bicubic
    colors:
    - '#b71c1c'
    - '#a81518'
    - '#960f14'
    - '#820a11'
    - '#6c070e'
    - '#56050b'
    - '#420307'
    - '#280204'
    - '#120001'
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#1b0708'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f0d6d6'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#c78f8f'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#c78f8f'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f0d6d6'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#c78f8f'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#ffeb3b'
    alpha: 0.92
    outline:
      enabled: true
      color: '#000000'
      linewidth: 0.8
      alpha: 0.7
    route:
      enabled: true
      color: '#ffeb3b'
      linewidth: 4.5
      alpha: 0.95
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#000000'
        linewidth: 1.2
      start_marker:
        style: concentric_circles
        color: '#5a9a63'
        ring_color: '#5a9a63'
        fill_color: '#120001'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#ffe082'
        ring_color: '#ffe082'
        fill_color: '#120001'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
