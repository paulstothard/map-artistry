map:
  background:
    fc: '#edf3f6'
    ec: '#edf3f6'
  frame:
    enabled: true
    color: '#3d4e57'
    padding: 0.04
  scheme: glacier
  debug_water_hillshade: false
  info:
    text: map-artistry
    show: false
    position: bottom-right
    font: Inter
    size: 0.01
    color: '#3d4e57'
  hillshade:
    azimuth: 315
    altitude: 45
    azimuths:
    - 315
    - 45
    - 270
    - 90
    weights:
    - 1.3
    - 1.0
    - 0.8
    - 0.8
    multidirectional: true
    vert_exag: 2.0
    cmap: gray
    alpha: 0
    sigma: 0.0
    unsharp_radius: 2.0
    unsharp_amount: 1.0
    interpolation: bicubic
    zorder: 0
  water_hillshade:
    blur_sigma: 5.0
    contrast: 0.45
    bias: 0.0
  terrain:
    visible: true
    alpha: 1.0
    zorder: 0
    percentiles:
    - 2
    - 98
    blend_mode: soft_light
    shade_strength: 0.55
    interpolation: bicubic
    colors:
    - '#5f7d6d'
    - '#789381'
    - '#93a995'
    - '#afbbb0'
    - '#c3c7c1'
    - '#d1d1ce'
    - '#ddd9d5'
    - '#e8e4e0'
    - '#f5f4f2'
    - '#ffffff'
  satellite:
    visible: false
    opacity: 1.0
  info_panel:
    enabled: false
    position: bottom
    height: 0.12
    background:
      color: '#1f4f6e'
      alpha: 1.0
    padding: 0.015
    zorder: 1000
    elements:
    - type: title
      id: title
      content: ''
      x: 0.03
      y: 0.65
      font: Inter
      font_weight: bold
      size: 0.42
      color: '#f8fdff'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.1
    - type: text
      id: subtitle
      content: ''
      x: 0.03
      y: 0.25
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#d7eaf4'
      alpha: 1.0
      align: left
      transform: uppercase
      tracking: 0.06
    - type: text
      id: location
      content: ''
      x: 0.97
      y: 0.65
      font: Inter
      font_weight: normal
      size: 0.14
      color: '#d7eaf4'
      alpha: 1.0
      align: right
      transform: uppercase
      tracking: 0.06
    - type: stats
      id: stats
      items: []
      x: 0.97
      y: 0.3
      align: right
      layout: horizontal
      spacing: 0.04
      font: Inter
      value_size: 0.22
      value_weight: bold
      value_color: '#f8fdff'
      value_alpha: 1.0
      label_size: 0.1
      label_weight: normal
      label_color: '#d7eaf4'
      label_alpha: 1.0
      transform: uppercase
  elevation_profile:
    enabled: true
    height: 0.04
    color: '#4a7f9e'
    alpha: 1.0
    route:
      enabled: true
      color: '#ff8a65'
      linewidth: 4.0
      alpha: 0.85
      sampling:
        mode: distance_interval
        interval_m: 300
        min_points: 40
        max_points: 500
      outline:
        enabled: true
        color: '#14384d'
        linewidth: 0.9
      start_marker:
        style: concentric_circles
        color: '#2e7d32'
        ring_color: '#2e7d32'
        fill_color: '#edf3f6'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
      end_marker:
        style: concentric_circles
        color: '#9c3d2e'
        ring_color: '#9c3d2e'
        fill_color: '#edf3f6'
        size: 8.0
        ring_width_scale: 0.14
        core_radius_scale: 0.17
        core_edge_width_scale: 0.035
